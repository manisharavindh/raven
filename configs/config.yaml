detection:
  model_path: "models/rdd2022_yolov8.pt"
  confidence_threshold: 0.35
  roi_polygon: [[0.0, 0.5], [1.0, 0.5], [1.0, 1.0], [0.0, 1.0]]

video:
  input_path: "data/input/road_video.mp4"
  output_path: "data/exports/raven_annotated.mp4"

output:
  evidence_dir: "data/evidence"
  detections_json: "data/exports/detections.json"
  report_json: "data/exports/report.json"

gps:
  source: "synthetic_road"
  simulation:
    city: "Coimbatore, Tamil Nadu, India"
    country: "India"
    seed: 42
  sampling_interval_seconds: 1.0
  speed:
    min_kmh: 20
    max_kmh: 50
  noise:
    enabled: true
    standard_deviation_meters: 2.0
    max_offset_meters: 5.0
  road_network:
    provider: "openstreetmap"
    vehicle_network_type: "drive"
    cache_path: "data/maps/coimbatore_roads.graphml"

tracking:
  max_disappeared: 10
  iou_threshold: 0.3
