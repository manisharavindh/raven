<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Mac OS Platinum Button Base -->
  <rect x="2" y="2" width="28" height="28" fill="#c0c0c0" stroke="#000000" stroke-width="2"/>
  
  <!-- White highlight (Top and Left) -->
  <rect x="4" y="4" width="24" height="2" fill="#ffffff" />
  <rect x="4" y="4" width="2" height="24" fill="#ffffff" />
  
  <!-- Dark gray shadow (Bottom and Right) -->
  <rect x="26" y="6" width="2" height="22" fill="#808080" />
  <rect x="6" y="26" width="22" height="2" fill="#808080" />
  
  <!-- Pixel Art Raven Silhouette -->
  <!-- Beak -->
  <rect x="22" y="12" width="4" height="2" fill="#000" />
  <rect x="20" y="14" width="6" height="2" fill="#000" />
  
  <!-- Head & Neck -->
  <rect x="14" y="8" width="8" height="2" fill="#000" />
  <rect x="12" y="10" width="10" height="2" fill="#000" />
  <rect x="10" y="12" width="10" height="2" fill="#000" />
  <rect x="10" y="14" width="10" height="2" fill="#000" />
  <rect x="10" y="16" width="10" height="2" fill="#000" />
  <rect x="8" y="18" width="12" height="2" fill="#000" />
  <rect x="6" y="20" width="14" height="2" fill="#000" />
  <rect x="6" y="22" width="14" height="2" fill="#000" />
  <rect x="6" y="24" width="14" height="2" fill="#000" />

  <!-- Glowing Red Eye -->
  <rect x="16" y="12" width="2" height="2" fill="#ff3333" />
</svg>